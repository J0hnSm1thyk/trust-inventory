name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: trust-inventory-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: trust-inventory-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            output: trust-inventory-macos-amd64
          - goos: darwin
            goarch: arm64
            output: trust-inventory-macos-arm64
          - goos: linux
            goarch: amd64
            output: trust-inventory-linux-amd64
          - goos: linux
            goarch: arm64
            output: trust-inventory-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.output }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum trust-inventory-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"
